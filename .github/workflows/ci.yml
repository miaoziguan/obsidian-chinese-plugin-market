name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 生产构建
        run: npm run build

      - name: 单元测试（vitest）
        run: npm test

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: E2E 测试（Playwright）
        run: npm run test:e2e

      - name: 上传 E2E 报告（失败时）
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
