name: Dictionary Auto-Update

on:
  schedule:
    # 每周日 UTC 00:00 运行（北京时间周一早 8 点）
    - cron: "0 0 * * 0"
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build check-dict-delta script
        run: |
          npx esbuild scripts/check-dict-delta.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=scripts/check-dict-delta.mjs

      - name: Run dictionary delta check
        id: delta
        run: node scripts/check-dict-delta.mjs

      - name: Read delta report
        id: report
        if: always()
        run: |
          if [ -f dict-delta-report.json ]; then
            echo "report<<EOF" >> $GITHUB_OUTPUT
            cat dict-delta-report.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request (if dictionary updated)
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto-update translation dictionary"
          title: "🌐 翻译词典自动更新"
          body: |
            ## 自动翻译词典更新

            本周社区插件增量检测结果：
            - 词典原有条目：自动统计
            - 新增插件：自动统计
            - 自动翻译成功：自动统计
            - 翻译失败（需人工）：自动统计

            详细报告请查看 CI 运行日志。
          branch: auto/dict-update
          base: main
          delete-branch: true

      - name: Create Issue for failed translations
        if: failure() || (success() && steps.report.outputs.report != '')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            let newCount = 0, translated = 0, untranslated = 0, failedIds = [];

            try {
              const raw = fs.readFileSync("dict-delta-report.json", "utf8");
              const report = JSON.parse(raw);
              newCount = report.newCount || 0;
              translated = report.translated || 0;
              untranslated = report.untranslated || 0;
              failedIds = report.failed || [];
            } catch {
              // 报告不存在（无新增），跳过
            }

            if (newCount === 0) {
              console.log("无新增插件，跳过 Issue 创建。");
              return;
            }

            let body = `## 翻译词典增量报告\n\n`;
            body += `**时间**: ${new Date().toISOString().slice(0, 10)}\n`;
            body += `**新增插件**: ${newCount} 个\n`;
            body += `**自动翻译成功**: ${translated} 个 ✅\n`;
            body += `**翻译失败**: ${untranslated} 个 ❌\n\n`;

            if (failedIds.length > 0) {
              body += `### 需要人工翻译的插件\n\n`;
              for (const id of failedIds) {
                body += `- \`${id}\`\n`;
              }
              body += `\n请手动翻译以上插件并提交 PR 更新词典。`;
            }

            // 查找是否已有同类 Issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["dictionary"],
              state: "open",
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🌐 翻译词典更新 (${new Date().toISOString().slice(0, 10)})`,
                body,
                labels: ["dictionary"],
              });
              console.log("已创建 Issue。");
            } else {
              console.log(`已有 ${issues.length} 个未关闭的 dictionary Issue，跳过创建。`);
            }
