name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write # 用于 actions/attest 生成构建来源证明（OIDC/sigstore）
  attestations: write # 用于将证明持久化到仓库（GitHub Artifact Attestations）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 生产构建
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 收集发布产物
        # 必须包含运行时资产：embedding-worker.bundle.js（worker 源码，app 层按路径读取）、
        # sql-wasm.wasm（SQLite 向量库）、ort-wasm-simd-threaded.jsep.wasm（ONNX 运行时）。
        # 缺任一项会导致语义搜索在本地静默降级/不可用（与 sync.sh 的同步清单保持一致）。
        run: |
          mkdir -p dist
          # dist/styles.css 已由生产构建压缩，不能用源码覆盖。
          cp main.js manifest.json versions.json dist/
          cp embedding-worker.bundle.js sql-wasm.wasm ort-wasm-simd-threaded.jsep.wasm dist/

      - name: 为构建产物生成来源证明（build provenance / attestation）
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/main.js,dist/styles.css"

      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 幂等保护：先查 release 是否已存在，已存在则跳过，避免重跑或本地/CI
          # 重复发布时 `gh release create` 报同名 tag 已存在而失败退出。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✓ Release $TAG 已存在，跳过（幂等保护）。"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG · CI 构建" \
            --notes "由 CI 自动构建并附构建来源证明（artifact attestations）。" \
            dist/main.js dist/manifest.json dist/styles.css dist/versions.json \
            dist/embedding-worker.bundle.js dist/sql-wasm.wasm dist/ort-wasm-simd-threaded.jsep.wasm
